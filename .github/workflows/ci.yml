name: CI

# Runs on pull requests from forks too. `pull_request` (not `pull_request_target`) gives
# fork PRs a read-only token and no repository secrets, and CI needs no secrets at all:
# every AI, narration and media provider is mocked in the tests.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly, so new advisories against unchanged dependencies are noticed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck:web

      - name: Build
        run: npm run build

  api:
    name: API lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Throwaway values: tests never read a real key and never reach the network.
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Scan
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix web --audit-level=moderate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        working-directory: api
        run: |
          pip install pip-audit
          ignores=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' pip-audit-ignore.txt | awk '{print "--ignore-vuln " $1}')
          # shellcheck disable=SC2086
          pip-audit -r requirements-dev.txt --progress-spinner off $ignores
